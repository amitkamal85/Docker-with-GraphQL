version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: graphql-sqlserver-dev
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # .NET 8 Backend API (Development with hot reload)
  backend:
    build:
      context: ./GraphQL_API/GraphQL_API
      dockerfile: Dockerfile
      target: build
    container_name: graphql-backend-dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=GraphQLDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
    ports:
      - "8080:8080"
    volumes:
      - ./GraphQL_API/GraphQL_API:/src
      - /src/bin
      - /src/obj
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - app-network
    command: dotnet watch run --urls http://+:8080

volumes:
  sqlserver_data:

networks:
  app-network:
    driver: bridge
